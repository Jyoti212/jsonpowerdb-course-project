<!DOCTYPE html>
<head>
    <title>Student Registration</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="http://login2explore.com/jpdb/resources/js/0.0.3/jpdb-commons.js"></script>
</head>

<body>
    <div class="container">
        <h2>Student Registration Form</h2>
        <form id="studentForm" method="post">
            <div class="form-group">
                <label for="rollNo">Roll No:</label>
                <input type="text" class="form-control" id="rollNo" name="rollNo"
                       placeholder="Enter Roll Number" required>
            </div>
            <div class="form-group">
                <label for="studentName">Full Name:</label>
                <input type="text" class="form-control" id="studentName" name="studentName"
                       placeholder="Enter Student Name">
            </div>
            <div class="form-group">
                <label for="studentClass">Class:</label>
                <input type="text" class="form-control" id="studentClass" name="studentClass"
                       placeholder="Enter Class (e.g. SY-IT)">
            </div>
            <div class="form-group">
                <label for="studentEmail">Email:</label>
                <input type="email" class="form-control" id="studentEmail" name="studentEmail"
                       placeholder="Enter Student Email">
            </div>
            <input type="button" class="btn btn-primary" id="studentSave" value="Save"
                   onclick="saveStudent();">
            <input type="button" class="btn btn-default" id="studentReset" value="Reset"
                   onclick="resetForm();">
        </form>
    </div>

    <script>
        $("#rollNo").focus();

        function validateAndGetFormData() {
            var rollNoVar = $("#rollNo").val();
            if (rollNoVar === "") {
                alert("Roll No is Required Value");
                $("#rollNo").focus();
                return "";
            }
            var nameVar = $("#studentName").val();
            if (nameVar === "") {
                alert("Student Name is Required Value");
                $("#studentName").focus();
                return "";
            }
            var classVar = $("#studentClass").val();
            if (classVar === "") {
                alert("Class is Required Value");
                $("#studentClass").focus();
                return "";
            }
            var emailVar = $("#studentEmail").val();
            if (emailVar === "") {
                alert("Email is Required Value");
                $("#studentEmail").focus();
                return "";
            }

            var jsonStrObj = {
                rollNo: rollNoVar,
                name: nameVar,
                class: classVar,
                email: emailVar
            };
            return JSON.stringify(jsonStrObj);
        }

        function resetForm() {
            $("#rollNo").val("");
            $("#studentName").val("");
            $("#studentClass").val("");
            $("#studentEmail").val("");
            $("#rollNo").focus();
        }

        function saveStudent() {
            var jsonStr = validateAndGetFormData();
            if (jsonStr === "") {
                return;
            }

            var putReqStr = createPUTRequest("90933410|-31949151356139044|90904440",
                    jsonStr, "College", "Student-Data");
            alert(putReqStr);

            jQuery.ajaxSetup({async: false});
            var resultObj = executeCommandAtGivenBaseUrl(putReqStr,
                    "http://api.login2explore.com:5577", "/api/iml");
            alert(JSON.stringify(resultObj));
            jQuery.ajaxSetup({async: true});

            resetForm();
        }
    </script>
</body>
</html>
